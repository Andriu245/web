<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menú - El Jardín de los Sentidos</title>
    <link rel="stylesheet" href="retro-styles.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #9B5DE5, #F15BB5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            padding: 20px;
        }

        .retro-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 80%;
            max-width: 800px;
        }

        .retro-title {
            color: #ffffff;
            font-size: 2.5em;
            text-align: center;
            text-transform: uppercase;
            text-shadow: 
                2px 2px 0 #9B5DE5,
                4px 4px 0 #5B6EE1;
            margin-bottom: 1.5rem;
            letter-spacing: 3px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 700px;
            margin: 1.5rem auto 0;
        }

        .menu-item {
            background: rgba(254, 228, 64, 0.9);
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .menu-item:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .icon {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #5B6EE1;
        }

        span {
            color: #5B6EE1;
            font-size: 1em;
            text-transform: uppercase;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
        }

        .menu-item span {
            color: #5B6EE1;
            font-size: 1em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
       .background-shapes {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: -1;
    }

    .shape {
        position: absolute;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 50%;
        animation: float 20s infinite;
    }

    .shape:nth-child(1) {
        width: 150px;
        height: 150px;
        top: 20%;
        left: 10%;
        animation-delay: 0s;
    }

    .shape:nth-child(2) {
        width: 100px;
        height: 100px;
        top: 60%;
        right: 15%;
        animation-delay: -5s;
    }

    .shape:nth-child(3) {
        width: 80px;
        height: 80px;
        bottom: 20%;
        left: 20%;
        animation-delay: -10s;
    }


    @keyframes float {
        0%, 100% {
            transform: translate(0, 0) rotate(0deg);
        }
        25% {
            transform: translate(10px, -20px) rotate(90deg);
        }
        50% {
            transform: translate(20px, 0) rotate(180deg);
        }
        75% {
            transform: translate(10px, 20px) rotate(270deg);
        }
    }
    </style>
</head>
<body>
    <div class="background-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <button class="retro-button" onclick="window.location.href='seleccion.html'">← Back</button>
    <div class="retro-container">
        <h1 class="retro-title">MENU</h1>
        <div class="menu-grid">
            <div class="menu-item" onclick="window.location.href='mansion.html'">
                <div class="icon">📚</div>
                <span>Historias</span>
            </div>
            <div class="menu-item" onclick="window.location.href='personajes.html'">
                <div class="icon">👥</div>
                <span>Personajes</span>
            </div>
            <div class="menu-item" onclick="window.location.href='ingredientes.html'">
                <div class="icon">🥚</div>
                <span>ingredientes</span>
            </div>
            <div class="menu-item" onclick="window.location.href='ayuda.html'">
                <div class="icon">📱</div>
                <span>Línea de Ayuda</span>
            </div>
            <div class="menu-item">
                <div class="icon">📷</div>
                <span>Fotos</span>
            </div>
            <div class="menu-item">
                <div class="icon">⚙️</div>
                <span>Ajustes</span>
            </div>
        </div>
    </div>
    <script>
        function createRandomShapes() {
        const container = document.querySelector('.background-shapes');
        const numberOfShapes = 10; // Puedes ajustar el número de burbujas

        for (let i = 0; i < numberOfShapes; i++) {
            const shape = document.createElement('div');
            shape.className = 'shape';
            
            // Tamaño aleatorio entre 30px y 150px
            const size = Math.random() * 120 + 30;
            shape.style.width = `${size}px`;
            shape.style.height = `${size}px`;
            
            // Posición aleatoria
            shape.style.left = `${Math.random() * 100}%`;
            shape.style.top = `${Math.random() * 100}%`;
            
            // Retraso aleatorio en la animación
            shape.style.animationDelay = `${Math.random() * -20}s`;
            
            container.appendChild(shape);
        }
    }

    // Llamar a la función cuando se carga la página
    window.onload = createRandomShapes;
</script>
</body>
</html>

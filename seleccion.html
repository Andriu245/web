<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Selección de Historia</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #9B5DE5, #F15BB5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .historias-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            max-width: 1000px;
            margin-top: 2rem;
        }

        .historia-card {
            background: rgba(254, 228, 64, 0.9);
            padding: 30px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .historia-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .historia-title {
            color: #5B6EE1;
            font-size: 1.4em;
            font-weight: bold;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 rgba(255,255,255,0.5);
            letter-spacing: 2px;
        }

        .retro-title {
            color: #ffffff;
            font-size: 3.5em;
            text-transform: uppercase;
            text-shadow: 
                3px 3px 0 #9B5DE5,
                6px 6px 0 #5B6EE1;
            margin-bottom: 2rem;
            letter-spacing: 4px;
        }

        .background-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite;
        }

        .shape:nth-child(1) {
            width: 150px;
            height: 150px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 100px;
            height: 100px;
            top: 60%;
            right: 15%;
            animation-delay: -5s;
        }

        .shape:nth-child(3) {
            width: 80px;
            height: 80px;
            bottom: 20%;
            left: 20%;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }
    </style>
</head>
<body>
    <div class="background-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <div class="container">
        <h1 class="retro-title">EMPIEZA TU HISTORIA</h1>
        <div class="historias-grid">
            <div class="historia-card" onclick="window.location.href='menu.html'">
                <div class="historia-title">LA MANSIÓN DE LAS SOMBRAS</div>
            </div>
            <div class="historia-card">
                <br>
                <div class="historia-title">PRÓXIMAMENTE</div>
            </div>
            <div class="historia-card">
                <br>
                <div class="historia-title">PRÓXIMAMENTE</div>
            </div>
        </div>
    </div>
</body>
</html>

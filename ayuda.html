<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Línea de Ayuda - El Jardín de los Sentidos</title>
    <link rel="stylesheet" href="retro-styles.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #9B5DE5, #F15BB5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Courier New', monospace;
            padding: 20px;
        }

        .help-container {
            width: 80%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .help-title {
            color: #ffffff;
            font-size: 2em;
            text-transform: uppercase;
            text-shadow: 2px 2px 0 #9B5DE5, 4px 4px 0 #5B6EE1;
            margin-bottom: 1rem;
            letter-spacing: 3px;
        }

        .help-subtitle {
            color: #ffffff;
            font-size: 1.2em;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .help-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .help-card {
            background: rgba(254, 228, 64, 0.9);
            padding: 25px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .help-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .help-icon {
            width: 80px;
            height: 80px;
            background: #5B6EE1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            color: white;
            margin-bottom: 10px;
        }

        .help-card h3 {
            color: #5B6EE1;
            margin: 0;
            font-size: 1.2em;
            text-transform: uppercase;
        }

        .help-card p {
            color: #666;
            margin: 0;
            font-size: 0.9em;
        }

        .menu-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(241, 91, 181, 0.9);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .menu-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(10px, -20px) rotate(90deg);
            }
            50% {
                transform: translate(20px, 0) rotate(180deg);
            }
            75% {
                transform: translate(10px, 20px) rotate(270deg);
            }
        }

        .background-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 20s infinite;
        }
    </style>
</head>
<body>
    <div class="background-shapes">
        <!-- Las burbujas se crearán dinámicamente con JavaScript -->
    </div>
    <button class="menu-button" onclick="window.location.href='menu.html'">← MENU</button>
    <div class="help-container">
        <h1 class="help-title">Línea de ayuda</h1>
        <p class="help-subtitle">Si requieres ayuda profesional para ti o para alguien más, te ofrecemos 2 opciones:</p>
        <div class="help-options">
            <div class="help-card" onclick="window.location.href='tel:911'">
                <div class="help-icon">📞</div>
                <h3>Línea de Emergencia</h3>
                <p>Llama al 911 para asistencia inmediata</p>
            </div>
            <div class="help-card" onclick="window.location.href='chat.html'">
                <div class="help-icon">👩‍💼</div>
                <h3>Chat de Ayuda</h3>
                <p>Habla con un profesional en línea</p>
            </div>
        </div>
    </div>
    <script>
        function createRandomShapes() {
            const container = document.querySelector('.background-shapes');
            const numberOfShapes = 10;

            for (let i = 0; i < numberOfShapes; i++) {
                const shape = document.createElement('div');
                shape.classList.add('shape');
                
                // Tamaño aleatorio entre 50px y 150px
                const size = Math.random() * 100 + 50;
                shape.style.width = `${size}px`;
                shape.style.height = `${size}px`;
                
                // Posición aleatoria
                shape.style.left = `${Math.random() * 100}%`;
                shape.style.top = `${Math.random() * 100}%`;
                
                // Retraso aleatorio en la animación
                shape.style.animationDelay = `${Math.random() * 5}s`;
                
                container.appendChild(shape);
            }
        }

        // Crear las burbujas cuando se carga la página
        window.addEventListener('load', createRandomShapes);
    </script>
</body>
</html>
